<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="./index.html">NONATO <span>&amp;</span> TAVARES</a>

    <main>
        <section class="hero">
            <div class="hero-copy">
                <p class="eyebrow">CATÁLOGO DE CINEMA</p>

                <p class="hero-text">Uma coleção para descobrir, lembrar e compartilhar os filmes que merecem uma sessão.</p>
                <a class="hero-action" href="#catalogo">Explorar catálogo <span>↓</span></a>
            </div>
            <img src="./imgs/foto maneira.png" alt="Cena de filme em destaque">
        </section>

        <section class="catalog" id="catalogo">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">EM CARTAZ NA MEMÓRIA</p>
                    <h2>Todos os filmes</h2>
                </div>
                <span class="catalog-mark">01 / coleção</span>
            </div>
            <section class="filmes"></section>
        </section>
    </main>

    <script src="server.js"></script>
